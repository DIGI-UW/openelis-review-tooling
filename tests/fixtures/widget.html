    <script>
      const version = new URLSearchParams(location.search).get("version") || "before";
      const steps =
        version === "after"
          ? [
              {
                step_id: "grist:102",

                route: "/Microbiology/cases/42",
              },
              {
                step_id: "grist:104",

              {
                step_id: "grist:101",
                do: "Open the worklist",
                expect: "The seeded case is listed",
                route: "/Microbiology/worklist",
              },
            ]
          : [
              {
                step_id: "grist:101",
                do: "Open the worklist",
                expect: "The seeded case is listed",
                route: "/Microbiology/worklist",
              },
              {
                step_id: "grist:102",
                do: "Record an isolate",
                expect: "The isolate is saved",
                route: "/Microbiology/cases/42",
              },
              {
                step_id: "grist:103",
                do: "Enter an AST result",
                expect: "The interpretation is calculated",
                route: "/Microbiology/cases/42",
              },
            ];

      window.__OE_REVIEW_TEST_OPEN_SHADOW__ = true;
      window.OE_REVIEW_TARGET = { deployment_id: "fixture-deployment" };
      window.OE_REVIEW_CHECKLIST = {
        title: "Microbiology MVP",
        instance: "amr",
        checklist_revision: `fixture-${version}`,
        sections: [{ title: "Workflow", steps }],

    <script
