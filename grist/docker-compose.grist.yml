# =============================================================================
# Light self-hosted Grist — authoring layer for the reviewer UAT checklists.
# Single container, built-in SQLite (no external DB/S3), joined to the shared
# oe-edge network as alias "grist" so the umbrella router can proxy to it.
# Own project so it starts/stops independently of the router/stacks:
#
#   docker compose -p oe-grist -f docker-compose.grist.yml up -d
#
# Reachable by humans only through the router vhost (grist.openelis-global.org,
# OIDC, TLS) once that DNS resolves; lifecycle tools reach it over the internal
# network and need no public DNS.
# =============================================================================

services:
  grist:
    image: gristlabs/grist:latest
    container_name: oe-edge-grist
    restart: unless-stopped
    environment:
      # Public URL the human UI is served under (set even before DNS resolves;
      # the REST API used by seed/generate works over the internal net regardless).
      - APP_HOME_URL=https://${GRIST_DOMAIN:-grist.openelis-global.org}
      # Light: no gVisor/pynbox sandbox. Acceptable for this authenticated,
      # single-tenant authoring instance; do not expose formula editing to
      # untrusted users in this mode.
      - GRIST_SANDBOX_FLAVOR=unsandboxed
      - GRIST_SINGLE_ORG=openelis
      - GRIST_DEFAULT_EMAIL=admin@openelis-global.org
      # OIDC login against the Dex IdP (simple static users + OAuth2 connectors).
      # Replaces the login-less boot-key: Grist redirects to Dex, the user signs
      # in, and lands in the doc UI as that email. Client secret is box-side env.
      - GRIST_OIDC_IDP_ISSUER=https://${GRIST_DOMAIN:-grist.openelis-global.org}/dex
      - GRIST_OIDC_IDP_CLIENT_ID=grist
      - GRIST_OIDC_IDP_CLIENT_SECRET=${DEX_GRIST_CLIENT_SECRET:-}
      - GRIST_OIDC_IDP_SCOPES=openid email profile
      # Dex doesn't advertise an end_session_endpoint; Grist requires one unless
      # told to skip it (logout just clears the local Grist session).
      - GRIST_OIDC_IDP_SKIP_END_SESSION_ENDPOINT=true
      # Trust the umbrella router's forwarded proto so Grist builds https URLs.
      - GRIST_FORWARD_URL_HOST=1
      # Native MCP server at /api/mcp (full edition). Authenticates with a Grist
      # API key or session; the OAuth-bearer path additionally needs the OIDC
      # server + Redis (see Phase B). No effect until the full edition is active.
      - GRIST_MCP_ENABLED=true
      # Web-client MCP auth: Grist runs its own OIDC server issuing tokens to MCP
      # clients (claude.ai/chatgpt.com auto-register via CIMD + DCR). Token storage
      # requires Redis — without REDIS_URL, /api/mcp rejects all OAuth bearer tokens.
      - GRIST_ENABLE_OIDC_SERVER=true
      - GRIST_ENABLE_OIDC_DCR=true
      - GRIST_OIDC_CIMD_ALLOWED_HOSTS=claude.ai,chatgpt.com
      - REDIS_URL=redis://redis:6379
    volumes:
      - grist-data:/persist
    networks:
      edge:
        aliases: [grist]
    depends_on:
      - dex
      - redis

  # Identity provider: simple static users + OAuth2 connectors. Served under
  # grist.openelis-global.org/dex (routed by the umbrella router). Secrets
  # (client secret, password hashes) come from the box-side .env, never committed.
  dex:
    image: dexidp/dex:latest
    container_name: oe-edge-dex
    restart: unless-stopped
    command: ["dex", "serve", "/etc/dex/config.yaml"]
    environment:
      - DEX_GRIST_CLIENT_SECRET=${DEX_GRIST_CLIENT_SECRET:-}
      - DEX_REVIEWER_PASSWORD_HASH=${DEX_REVIEWER_PASSWORD_HASH:-}
      - DEX_ADMIN_PASSWORD_HASH=${DEX_ADMIN_PASSWORD_HASH:-}
    volumes:
      - ./dex/config.yaml:/etc/dex/config.yaml:ro
    networks:
      edge:
        aliases: [dex]

  # Ephemeral token store for Grist's OIDC server (web-client MCP auth). Losing it
  # just means outstanding MCP OAuth sessions must re-auth; no durable data here.
  redis:
    image: redis:7-alpine
    container_name: oe-edge-redis
    restart: unless-stopped
    networks:
      edge:
        aliases: [redis]

  # Public Grist-to-widget read transformer. Authoring is exclusively through
  # Grist's native OAuth/API-key MCP endpoint at /api/mcp.
  uat-read:
    build:
      context: ./mcp
      dockerfile: Dockerfile
    image: oe-edge-grist-uat-read
    container_name: oe-edge-grist-uat-read
    restart: unless-stopped
    environment:
      - GRIST_URL=http://grist:8484
      - GRIST_ORG=openelis
      - GRIST_DOC_NAME=UAT Checklists
      - GRIST_KEY_FILE=/run/grist-state/.api-key
      - PORT=8585
      # Which application vouches for the reviewers of each review. A submission
      # is attributed to whoever holds the session cookie there, so an instance
      # missing from this map cannot be submitted to at all — recording a name
      # nothing checked would be indistinguishable from one that was verified.
      - REVIEW_BACKENDS=${REVIEW_BACKENDS:-amr=https://amr-oe:8443,analyzers=https://analyzers-oe:8443}
    volumes:
      - ${GRIST_STATE_DIR:-/home/ubuntu/oe-grist}:/run/grist-state:ro
    networks:
      edge:
        aliases: [uat-read]
    depends_on:
      - grist

volumes:
  grist-data:

networks:
  edge:
    external: true
    name: oe-edge
