name: Review tooling CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The submission tests run grist/uat-read/server.mjs for real, and it has its own
      # dependencies. Without this the service dies at import and every one of
      # those tests fails as a connection error.
      - run: npm ci --prefix grist/uat-read
      - run: npm test
      - name: Validate portable Nginx integration
        run: python3 -m unittest discover -s tests -p '*_test.py' -v
      - name: Exercise external sites through Nginx
        run: python3 tests/nginx-smoke.py
      - run: npx playwright install --with-deps chromium
      - run: npm run test:widget
      - name: Retain widget workflow evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: review-widget-evidence-${{ github.sha }}
          path: test-results/
          if-no-files-found: ignore
      - name: Validate shell
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          git ls-files -z "*.sh" | xargs -0 shellcheck
      - name: Validate Compose configuration
        env:
          AMR_DOMAIN: amr.example.org
          ANALYZERS_DOMAIN: analyzers.example.org
          GRIST_DOMAIN: grist.example.org
          DEX_GRIST_CLIENT_SECRET: test-secret
          DEX_REVIEWER_PASSWORD_HASH: test-hash
          GRIST_STATE_DIR: /tmp/oe-grist
        run: |
          docker compose -f router/docker-compose.router.yml config -q
          docker compose -f grist/docker-compose.grist.yml config -q
